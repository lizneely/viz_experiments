<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O'Keeffe to Scale · O'Keeffe Experiments</title>
    <!-- Written for p5.js 1.x. Keep this version; p5 2.x changed some functions it uses. -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
:root{--ground:#EEF0EE;--ink:#1D2226;--ink2:#4C555C;--ink3:#7C868D;--g:#A3302A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--ground:#15191B;--ink:#E6E9E8;--ink2:#B3BBBF;--ink3:#848E94;--g:#E8746A}}
:root[data-theme="dark"]{color-scheme:dark;--ground:#15191B;--ink:#E6E9E8;--ink2:#B3BBBF;--ink3:#848E94;--g:#E8746A}
body{background:var(--ground);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:32px 56px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:clamp(30px,5vw,48px);line-height:1.05;margin:8px 0 10px;text-wrap:balance}
h1 em{color:var(--g)}
.lede{max-width:66ch;color:var(--ink2);margin:0 0 18px;font-size:15.5px;line-height:1.55}
#stage{width:100%;touch-action:pan-y}
#stage canvas{display:block}
#card b{font-weight:500}
.lab{background:var(--ink);color:var(--ground)}
.lab-in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:16px 15px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.lab-brand{display:flex;align-items:center;gap:10px;font-family:"Newsreader",Georgia,serif;font-size:22px;font-weight:500;line-height:1;white-space:nowrap}
.lab-brand em{font-style:italic;font-weight:400}
.lab-mark{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;position:relative;flex:none}
.lab-mark::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--g)}
.lab-note{display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.45;opacity:.92;max-width:72ch}
.lab-pill{font:500 10.5px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:4px 8px;white-space:nowrap;opacity:.85}
</style>
  </head>
  <body>
    <div class="lab" role="note" aria-label="About this prototype">
  <div class="lab-in">
    <div class="lab-brand"><span class="lab-mark" aria-hidden="true"></span>O'Keeffe Experiments</div>
    <div class="lab-note"><span class="lab-pill">Prototype</span><span>The following prototype is for experimental purposes and is using information that has not been reviewed.</span></div>
  </div>
</div>
<div class="wrap">
  <div class="eyebrow">Georgia O'Keeffe Museum · Catalogue raisonné · p5.js</div>
  <h1>O'Keeffe to Scale</h1>

  <div id="stage"></div>
</div>
    <script src="sketch.js"></script>
<!-- O'Keeffe Experiments: shared banner link + footer (v3).
     Paste this whole block just before </body> in any prototype's index.html.
     It replaces the earlier "All prototypes" block (v1 or v2): delete that one first.

     It does two things:
     1. Adds "All prototypes" to the O'Keeffe Experiments banner without making it taller.
     2. Sets the footer text and adds a "Share your feedback" link. If the page already
        has a footer note (class "fine"), its text is replaced; if not, a footer is added.

     To change the footer wording or links later, edit the three lines marked EDIT below. -->
<style>
  /* Banner link */
  .okx-home {
    flex: none; display: inline-flex; align-items: center; gap: 7px; margin-left: auto;
    font: 600 13px/1 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: inherit; text-decoration: none; white-space: nowrap;
    border: 1px solid currentColor; border-radius: 999px; padding: 7px 12px;
  }
  .okx-home svg { width: 12px; height: 12px; flex: none; }
  .okx-home:hover { background: rgba(127, 127, 127, .2); }
  .okx-home:focus-visible, .okx-feedback:focus-visible { outline: 2px solid #E8746A; outline-offset: 3px; }
  .okx-banner .lab-note { flex: 1 1 320px; min-width: 0; }
  @media (max-width: 760px) {
    .okx-banner .okx-home { order: 1; padding: 5px 11px; }
    .okx-banner .lab-note { order: 2; flex-basis: 100%; }
  }
  @media (max-width: 480px) {
    .okx-home { padding: 5px 9px; }
    .okx-home .okx-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  }
  .okx-bar { background: #1D2226; color: #EEF0EE; padding: 10px 20px; display: flex; }

  /* Footer */
  .okx-footer { max-width: 1120px; margin: 0 auto; padding: 24px 20px 48px; }
  .okx-footer-in { display: grid; gap: 12px; justify-items: start; }
  .okx-fine {
    margin: 0; max-width: 80ch;
    font: 13px/1.55 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink3, #7C868D);
  }
  .okx-fine em { font-style: italic; }
  .okx-feedback {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 13.5px/1 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink, #1D2226); text-decoration: none;
    border: 1.5px solid currentColor; border-radius: 999px; padding: 8px 14px;
  }
  .okx-feedback:hover { background: var(--ink, #1D2226); color: var(--ground, #EEF0EE); }
</style>
<a class="okx-home" href="https://okeeffe-experiments.netlify.app/" title="All O'Keeffe Experiments prototypes">
  <svg viewBox="0 0 12 12" aria-hidden="true"><g fill="currentColor"><rect x="0" y="0" width="5" height="5" rx="1"/><rect x="7" y="0" width="5" height="5" rx="1"/><rect x="0" y="7" width="5" height="5" rx="1"/><rect x="7" y="7" width="5" height="5" rx="1"/></g></svg>
  <span class="okx-label">All prototypes</span>
</a>
<script>
  (function () {
    // EDIT: footer text (HTML is allowed, e.g. <em>)
    var FOOTER_TEXT = "O'Keeffe Experiments is from the Digital Experience team at the Georgia O'Keeffe Museum. These prototypes use data and images from <em>Access O'Keeffe</em>, including the catalogue raisonné, along with some subject information added with the help of AI. Because these are prototypes, the data and images have not been reviewed for publication in this format.";
    // EDIT: feedback form link and its label
    var FEEDBACK_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdsjmbq0M56niYfdl4N5c52cS8dOA0HCDvSLCFJTwfPspdQbg/viewform?usp=publish-editor";
    var FEEDBACK_LABEL = "Share your feedback ↗";

    // 1. Banner link
    var link = document.currentScript.previousElementSibling;
    var banner = document.querySelector(".lab-in");
    if (banner) {
      banner.classList.add("okx-banner");
      banner.appendChild(link);
    } else {
      var bar = document.createElement("div");
      bar.className = "okx-bar";
      bar.appendChild(link);
      document.body.insertBefore(bar, document.body.firstChild);
    }

    // 2. Footer
    var feedback = document.createElement("a");
    feedback.className = "okx-feedback";
    feedback.href = FEEDBACK_URL;
    feedback.target = "_blank";
    feedback.rel = "noopener";
    feedback.textContent = FEEDBACK_LABEL;

    var existing = document.querySelector("footer .fine") || document.querySelector(".foot .fine");
    if (existing) {
      existing.innerHTML = FOOTER_TEXT;
      existing.insertAdjacentElement("afterend", feedback);
      feedback.style.marginTop = "12px";
    } else {
      var footer = document.createElement("footer");
      footer.className = "okx-footer";
      footer.innerHTML = '<div class="okx-footer-in"><p class="okx-fine"></p></div>';
      footer.querySelector(".okx-fine").innerHTML = FOOTER_TEXT;
      footer.firstChild.appendChild(feedback);
      // Line the footer up with the banner's content width
      if (banner) footer.style.maxWidth = getComputedStyle(banner).maxWidth;
      document.body.appendChild(footer);
      // p5 may add its canvas to the end of the page after this runs; keep the footer last.
      window.addEventListener("load", function () {
        setTimeout(function () { document.body.appendChild(footer); }, 300);
      });
    }
  })();
</script>
  </body>
</html>
